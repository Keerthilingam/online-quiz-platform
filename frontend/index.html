<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card" id="login-box">
        <h1>Welcome Back</h1>
        <input type="email" id="email" placeholder="Email (e.g., test@quiz.com)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Enter the Arena</button>
        <button class="secondary-btn" onclick="toggleMode()">Switch to Register</button>
        <div id="msg" class="message"></div>
    </div>

    <div class="glass-card hidden" id="register-box">
        <h1>Create Account</h1>
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <!-- Magic Dropdown: Shows the secret box if Admin is picked -->
        <select id="reg-role" style="background: rgba(0,0,0,0.5);" onchange="document.getElementById('admin-secret').style.display = this.value === 'admin' ? 'block' : 'none'">
            <option value="user">Student</option>
            <option value="admin">Teacher (Admin)</option>
        </select>
        <input type="password" id="admin-secret" placeholder="Enter Organization Teacher Code" style="display:none;">
        <button onclick="register()">Create Account</button>
        <button class="secondary-btn" onclick="toggleMode()">Back to Login</button>
        <div id="reg-msg" class="message"></div>
    </div>

    <script>
        const API = 'https://online-quiz-platform-9vug.onrender.com/api/auth';
        
        function toggleMode() {
            document.getElementById('login-box').classList.toggle('hidden');
            document.getElementById('register-box').classList.toggle('hidden');
        }

        async function login() {
            document.getElementById('msg').innerText = "Waking up the server... please wait 30 seconds.";
            const json = { email: document.getElementById('email').value, password: document.getElementById('password').value };
            try {
                const res = await fetch(`${API}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(json) });
                const data = await res.json();
                
                if(res.ok) {
                    localStorage.setItem('token', data.token); // Store VIP Wristband
                    localStorage.setItem('email', json.email);
                    
                    // Decode the Token to see if they are a user or an admin
                    const payload = JSON.parse(atob(data.token.split('.')[1]));
                    if(payload.role === 'admin') window.location.href = 'admin.html';
                    else window.location.href = 'student.html';
                } else {
                    document.getElementById('msg').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('msg').innerText = "Server is asleep! Start python app.py";
            }
        }

        async function register() {
            document.getElementById('reg-msg').innerText = "Registering... (Server might be waking up)";
            const json = { 
                email: document.getElementById('reg-email').value, 
                password: document.getElementById('reg-password').value,
                role: document.getElementById('reg-role').value,
                admin_secret: document.getElementById('admin-secret').value
            };
            const res = await fetch(`${API}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(json) });
            const data = await res.json();
            
            if(res.ok) {
                document.getElementById('reg-msg').className = 'message success';
                document.getElementById('reg-msg').innerText = "Account Created! Switching to Login...";
                setTimeout(toggleMode, 1500);
            } else {
                document.getElementById('reg-msg').innerText = data.error;
            }
        }
    </script>
</body>
</html>
